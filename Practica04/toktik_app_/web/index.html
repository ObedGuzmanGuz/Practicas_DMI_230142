<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TokTik Azul · videos cortos, favoritos y descubrimiento.">
  <meta name="theme-color" content="#071020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TokTik Azul">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>TokTik Azul</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #071020;
      overflow: hidden;
    }

    #web-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      background: radial-gradient(circle at 50% 20%, #112448 0%, #071020 65%);
      color: #f4f7ff;
      transition: opacity .35s ease, visibility .35s ease;
      font-family: Arial, Helvetica, sans-serif;
    }

    #web-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #web-splash img {
      width: 132px;
      height: 132px;
      border-radius: 30px;
      box-shadow: 0 0 42px rgba(0,180,255,.25);
    }

    #web-splash .brand {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    #web-splash .brand span {
      color: #00B4FF;
    }

    #web-splash .loading {
      width: 130px;
      height: 4px;
      border-radius: 999px;
      overflow: hidden;
      background: #1d2b43;
    }

    #web-splash .loading span {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #00B4FF, #7C4DFF, #FF2D95);
      animation: tokTikLoad 1.1s ease-in-out infinite;
    }

    @keyframes tokTikLoad {
      0% { transform: translateX(-120%); }
      50% { transform: translateX(115%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="web-splash">
    <img src="icons/Icon-512.png" alt="TokTik Azul">
    <div class="brand">TOKTIK <span>AZUL</span></div>
    <div class="loading"><span></span></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('web-splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () {
        splash.remove();
      }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
