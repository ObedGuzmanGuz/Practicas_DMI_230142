name: toktik_app
description: "Práctica 04: TokTik Azul con Cloudinary, YouTube, Vimeo, Dailymotion y temas estacionales."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  audioplayers: ^6.8.1
  video_player: ^2.14.1
  in_app_webview_flutter: ^1.1.0
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  http: ^1.3.0
  url_launcher: ^6.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/toktik_icon.png
    - assets/audio/

# Se conserva la implementación web personalizada de video_player incluida
# en la práctica para la reproducción de videos remotos.
dependency_overrides:
  video_player_web:
    path: packages/video_player_web
