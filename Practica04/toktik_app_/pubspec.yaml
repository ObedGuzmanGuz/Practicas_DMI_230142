name: toktik_app
description: "Práctica 04: TokTik Azul con videos desde Google Drive."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  video_player: ^2.14.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0
flutter:
  uses-material-design: true

# Ajuste del plugin oficial para los encabezados CORS de Google Drive.
dependency_overrides:
  video_player_web:
    path: packages/video_player_web
